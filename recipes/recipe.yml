---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: saifdora-silverblue-45
description: Saifdora Silverblue 45 - Custom Fedora Atomic Silverblue Image
base-image: quay.io/fedora-ostree-desktops/silverblue
image-version: 45

modules:
  - type: files
    files:
      - source: system
        destination: /

  # Import RPM Fusion GPG signing keys into RPM database
  - type: script
    snippets:
      - "rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion*"

  # Install required multimedia codecs, drivers, fonts, and utilities from Fedora & RPM Fusion
  - type: rpm-ostree
    keys:
      - /etc/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion-free-fedora-2020
      - /etc/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion-nonfree-fedora-2020
    repos:
      - https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-%OS_VERSION%.noarch.rpm
      - https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-%OS_VERSION%.noarch.rpm
    remove:
      - gnome-tour
    install:
      # RPM Fusion release packages
      - https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-%OS_VERSION%.noarch.rpm
      - https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-%OS_VERSION%.noarch.rpm

      # Hardware acceleration & codecs
      - libavcodec-freeworld
      - gstreamer1-plugins-bad-freeworld
      - gstreamer1-plugins-ugly
      - gstreamer1-plugin-libav
      - mesa-va-drivers-freeworld
      - intel-media-driver

      # Image formats & thumbnails
      - libheif-freeworld
      - heif-pixbuf-loader
      - webp-pixbuf-loader
      - ffmpegthumbnailer

      # Compression & archiving
      - unrar
      - p7zip
      - p7zip-plugins

      # Arabic, office & global fonts
      - google-noto-sans-arabic-fonts
      - vazirmatn-fonts
      - amiri-fonts
      - google-carlito-fonts
      - google-crosextra-caladea-fonts
      - liberation-fonts
      - google-noto-nastaliq-urdu-fonts
      - google-noto-sans-devanagari-fonts
      - google-noto-sans-cjk-vf-fonts

      # Localization & 12 language packs
      - langpacks-en
      - langpacks-ar
      - langpacks-ru
      - langpacks-es
      - langpacks-tr
      - langpacks-fr
      - langpacks-it
      - langpacks-hi
      - langpacks-zh_CN
      - langpacks-ur
      - langpacks-ms
      - langpacks-id
      - glibc-langpack-ar
      - gnome-tweaks
      - gnome-menus
      - adw-gtk3-theme

      # Hardware detection & Secure Boot management
      - pciutils
      - mokutil

      # Rumman media converters & processors (ffmpeg is provided by pre-installed ffmpeg-free + libavcodec-freeworld)
      - ImageMagick
      - ghostscript
      - poppler-utils
      - python3-cairo

  # System-wide Flatpaks configuration (disables Fedora remote and enables Flathub)
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        repo:
          name: flathub
          title: Flathub
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
        install:
          - com.mattjakeman.ExtensionManager
          - com.github.tchx84.Flatseal
          - org.videolan.VLC
          - page.tesk.Refine
          - com.usebottles.bottles
          - net.davidotek.pupgui2

  # Compile dconf defaults, glib schemas, update MIME database, and customize os-release
  - type: script
    snippets:
      - "glib-compile-schemas /usr/share/glib-2.0/schemas || true"
      - "dconf update"
      - "update-desktop-database /usr/share/applications || true"
      - |
        sed -i 's/^NAME=.*/NAME="Saifdora"/' /usr/lib/os-release
        sed -i 's/^PRETTY_NAME=.*/PRETTY_NAME="Saifdora 45 (Silverblue)"/' /usr/lib/os-release
        sed -i 's/^DEFAULT_HOSTNAME=.*/DEFAULT_HOSTNAME="saifdora"/' /usr/lib/os-release
        if grep -q '^ANSI_COLOR=' /usr/lib/os-release; then
          sed -i 's/^ANSI_COLOR=.*/ANSI_COLOR="0;38;2;122;28;51"/' /usr/lib/os-release
        else
          echo 'ANSI_COLOR="0;38;2;122;28;51"' >> /usr/lib/os-release
        fi

  # Enable flatpak system services and user D-Bus reload path
  - type: systemd
    system:
      enabled:
        - flatpak-configure-languages.service
        - saifdora-theme-overrides.service
    user:
      enabled:
        - saifdora-flatpak-dbus-reload.path

  # Container signing policy configuration
  - type: signing
