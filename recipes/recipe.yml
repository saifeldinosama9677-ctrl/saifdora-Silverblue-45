---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: saifdora-silverblue-45
description: Saifdora Silverblue 45 - Custom Fedora Atomic Silverblue Image
base-image: quay.io/fedora-ostree-desktops/silverblue
image-version: 45

modules:
  - type: files
    files:
      - source: system
        destination: /

  # Import RPM Fusion GPG signing keys into RPM database
  - type: script
    snippets:
      - "rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion*"

  # Install required multimedia codecs, drivers, fonts, and utilities from Fedora & RPM Fusion
  - type: rpm-ostree
    keys:
      - /etc/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion-free-fedora-2020
      - /etc/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion-nonfree-fedora-2020
    repos:
      - https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-%OS_VERSION%.noarch.rpm
      - https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-%OS_VERSION%.noarch.rpm
    install:
      # RPM Fusion release packages
      - https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-%OS_VERSION%.noarch.rpm
      - https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-%OS_VERSION%.noarch.rpm

      # Hardware acceleration & codecs
      - libavcodec-freeworld
      - gstreamer1-plugins-bad-freeworld
      - gstreamer1-plugins-ugly
      - gstreamer1-plugin-libav
      - mesa-va-drivers-freeworld
      - intel-media-driver

      # Image formats & thumbnails
      - libheif-freeworld
      - heif-pixbuf-loader
      - webp-pixbuf-loader
      - ffmpegthumbnailer

      # Compression & archiving
      - unrar
      - p7zip
      - p7zip-plugins

      # Arabic & office fonts
      - google-noto-sans-arabic-fonts
      - vazirmatn-fonts
      - amiri-fonts
      - google-carlito-fonts
      - google-crosextra-caladea-fonts
      - liberation-fonts

      # Localization & GNOME tools
      - langpacks-ar
      - glibc-langpack-ar
      - gnome-tweaks
      - adw-gtk3-theme

      # Hardware detection & Secure Boot management
      - pciutils
      - mokutil

      # Rumman media converters & processors (ffmpeg is provided by pre-installed ffmpeg-free + libavcodec-freeworld)
      - ImageMagick
      - ghostscript
      - poppler-utils
      - python3-cairo

  # System-wide Flatpaks configuration (disables Fedora remote and enables Flathub)
  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        repo:
          name: flathub
          title: Flathub
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
        install:
          - com.mattjakeman.ExtensionManager
          - com.github.tchx84.Flatseal
          - org.videolan.VLC

  # Compile dconf database defaults and glib schemas
  - type: script
    snippets:
      - "glib-compile-schemas /usr/share/glib-2.0/schemas || true"
      - "dconf update"

  # Enable flatpak system language configuration service on boot
  - type: systemd
    system:
      enabled:
        - flatpak-configure-languages.service

  # Container signing policy configuration
  - type: signing
